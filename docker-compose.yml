version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5051:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hub:hub_dev_password@postgres:5432/hub
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPERATOR_MODEL: ${OPERATOR_MODEL:-gpt-4o-mini}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-changeme}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-relay-dev-secret-change-in-production}
      NEUTTS_URL: ${NEUTTS_URL:-http://neutts:8000}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - relay_uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_WS_URL: ws://localhost:5051
      VITE_API_URL: http://localhost:5051
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    volumes:
      - kokoro_models:/app/api/src/models
    environment:
      - KOKORO_DEFAULT_VOICE=af_heart
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  neutts:
    build: ./neutts-server
    ports:
      - "8810:8000"
    volumes:
      - ./neutts-server/voices:/app/voices
      - neutts_cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  kokoro_models:
  relay_uploads:
  neutts_cache:
