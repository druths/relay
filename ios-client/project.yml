name: Relay
options:
  bundleIdPrefix: com.relay
  deploymentTarget:
    iOS: "17.0"
    macCatalyst: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  Runestone:
    url: https://github.com/simonbs/Runestone
    from: "0.4.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

targets:
  Relay:
    type: application
    platform: iOS
    sources:
      - path: Relay
        excludes:
          - "Info.plist"
    info:
      path: Relay/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "Relay needs microphone access for voice input."
        NSSpeechRecognitionUsageDescription: "Relay uses speech recognition to transcribe your voice input."
        NSCameraUsageDescription: "Relay uses the camera when you attach a photo from the + menu."
        NSPhotoLibraryUsageDescription: "Relay reads selected photos when you attach images from the + menu."
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        UIAppFonts:
          - VT323-Regular.ttf
          - PressStart2P-Regular.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - relay
            CFBundleURLName: io.titanforge.relay
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.titanforge.relay
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 1 = iPhone, 2 = iPad, 6 = Mac. Including 6 opts the app into
        # the Mac idiom under Catalyst (Xcode's "Optimize Interface
        # for Mac" option), which gives native Mac window chrome and
        # free-form resize rather than iPad proportions.
        TARGETED_DEVICE_FAMILY: "1,2,6"
        DEVELOPMENT_TEAM: QC87L4M3K5
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_ENTITLEMENTS: Relay/Relay.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - target: RelayWidgetExtension
        platformFilter: iOS
      - package: Runestone
      - package: MarkdownUI
    postBuildScripts:
      - name: Install Catalyst build to /Applications
        # After every successful Mac Catalyst build, mirror the
        # product into /Applications so Spotlight / Launchpad /
        # ⌘Space launch the latest dev iteration. No-op on iOS
        # builds. Idempotent: wipes the previous copy before
        # installing.
        # Gate on `IS_MACCATALYST`, not `PLATFORM_NAME` — on
        # Catalyst, `PLATFORM_NAME` is `macosx` (same as a native
        # Mac build); `IS_MACCATALYST=YES` is the only reliable
        # signal that we're producing a Catalyst product.
        script: |
          if [ "$IS_MACCATALYST" != "YES" ]; then
            exit 0
          fi
          BUILT_APP="$BUILT_PRODUCTS_DIR/$WRAPPER_NAME"
          if [ ! -d "$BUILT_APP" ]; then
            exit 0
          fi
          rm -rf "/Applications/$WRAPPER_NAME"
          cp -R "$BUILT_APP" "/Applications/"
          echo "[install-app] copied to /Applications/$WRAPPER_NAME"
        basedOnDependencyAnalysis: false

  RelayWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: RelayWidgetExtension
        excludes:
          - "Info.plist"
      - path: Relay/Models/RelayActivityAttributes.swift
      - path: Relay/Models/LiveActivityIntents.swift
    info:
      path: RelayWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Relay Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.titanforge.relay.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: QC87L4M3K5
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
