name: Relay
options:
  bundleIdPrefix: com.relay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  Runestone:
    url: https://github.com/simonbs/Runestone
    from: "0.4.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

targets:
  Relay:
    type: application
    platform: iOS
    sources:
      - path: Relay
        excludes:
          - "Info.plist"
    info:
      path: Relay/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "Relay needs microphone access for voice input."
        NSSpeechRecognitionUsageDescription: "Relay uses speech recognition to transcribe your voice input."
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        UIAppFonts:
          - VT323-Regular.ttf
          - PressStart2P-Regular.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - relay
            CFBundleURLName: io.titanforge.relay
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.titanforge.relay
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: QC87L4M3K5
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - target: RelayWidgetExtension
      - package: Runestone
      - package: MarkdownUI

  RelayWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: RelayWidgetExtension
        excludes:
          - "Info.plist"
      - path: Relay/Models/RelayActivityAttributes.swift
      - path: Relay/Models/LiveActivityIntents.swift
    info:
      path: RelayWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Relay Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.titanforge.relay.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: QC87L4M3K5
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
